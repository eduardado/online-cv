experiences:
  title: Professional Experience
  info:
    - role: Java Backend Software Engineer
      company: Contal Group; Brisbane - Sep 2024 - Present
      details: |
        Primary developer of a new rostering platform, working across relational database design, reusable REST APIs, and an interactive React frontend integrated with the legacy system. Translate product requirements into modular software supporting complex scheduling workflows. 

        Implement automated tests, transaction handling, and database migrations. Deploy containerised development builds and maintain and troubleshoot existing Java applications.

        **Stack**: Java (Spring Boot), Hibernate, Informix/SQL, React, JavaScript, JUnit, Mockito, Gradle, Docker, Portainer, Git.
    - role: Software Engineer (Database Consultant - Volunteer)
      # time: Jun 2024 - Sep 2024
      company: Australian Koala Foundation, Brisbane;  Brisbane - Jun 2024 - Sep 2024
      details: |
        Led system analysis and requirements gathering to architect a PostgreSQL/PostGIS geospatial model for 30 years of legacy research data. Established the technical foundation for transitioning disparate spreadsheets into a unified, searchable system.

        **Stack**: PostgreSQL, PostGIS, Docker, Python, SQL, Psql
    - role: Software Developer (Full Stack)
      # time: Mar 2021 - Feb 2024
      company: Tier1 Technologies; Seville, Spain; Mar 2021 - Feb 2024
      details: |
        Developed modular Java and Spring features for enterprise ERP and Retail (Web/POS) platforms. I built custom libraries for hardware I/O and third-party API integrations while handling frontend development using JavaFX for POS systems and JSP/Vaadin for web platforms. I also maintained MuleSoft (ESB) workflows and GitLab CI/CD pipelines for our development environments.

        **Stack**: Java (Spring), JavaScript (Vaadin/JSP), JavaFX, REST, ESB (MuleSoft), Git, GitLab CI/CD.
    - role: Clinical Scientist (Biotech Career)
      # time: 2016 - 2018
      company: NHS (UK) | IVI RMA Global (Spain); 2016 - 2018
      details: |
        Led the rollout of an electronic traceability system across seven IVI RMA clinics, including implementation and staff training. Safeguarded sensitive genetic material through precise laboratory workflows while providing compassionate, clear updates to patients throughout their treatment.

