career-profile:
  title: Career Profile
  summary: |
    Software Engineer with 4+ years of experience specializing in the Java ecosystem (Spring Boot, REST APIs). I offer a strong foundation in RDBMS (PostgreSQL, MySQL, Oracle) and system integrations, complemented by full-stack versatility in React and JavaScript.

    Driven by "under-the-hood" curiosity, I am currently expanding my expertise into DevOps (Docker, CI/CD, Kubernetes) to ensure code quality from development to production.

    Coming from a background as a Clinical Scientist, I bring an exceptional level of precision, analytical rigor, and a commitment to clear documentation—qualities that define my approach to building reliable software.

